name: Order-20 adaptive SAT certificates

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: JSON array of adaptive parent-cube tasks
        required: true
        type: string
        default: >-
          [{"degree":9,"cover_left":0,"parent_index":31}]

permissions:
  contents: read
  actions: read

jobs:
  certify:
    name: d${{ matrix.degree }} p${{ matrix.cover_left }} c${{ matrix.parent_index }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.tasks) }}

    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build pinned Gimsatul
        run: |
          git clone --quiet https://github.com/arminbiere/gimsatul.git tools/gimsatul
          git -C tools/gimsatul checkout --quiet 4664fd74c97f87e30e7f907181707679b6fa49f2
          cd tools/gimsatul
          ./configure
          make -j4

      - name: Build pinned Kissat
        run: |
          git clone --quiet https://github.com/arminbiere/kissat.git tools/kissat
          git -C tools/kissat checkout --quiet 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd tools/kissat
          ./configure
          make -j4

      - name: Build pinned upstream drat-trim
        run: |
          git clone --quiet https://github.com/marijnheule/drat-trim.git tools/drat-trim
          git -C tools/drat-trim checkout --quiet 2e3b2dc0ecf938addbd779d42877b6ed69d9a985
          gcc tools/drat-trim/drat-trim.c -O2 -std=c99 \
            -o tools/drat-trim/drat-trim

      - name: Build pinned CaDiCaL cube generator
        run: |
          git clone --quiet https://github.com/arminbiere/cadical.git tools/cadical
          git -C tools/cadical checkout --quiet c60730422e758ef1cebe7aeddf2dda31c996bf04
          cd tools/cadical
          ./configure
          make -j4
          cd ../..
          g++ -O2 -std=c++17 -Itools/cadical/src \
            research/minimum_counterexample/generate_cadical_cubes.cpp \
            tools/cadical/build/libcadical.a -lpthread \
            -o tools/generate-cadical-cubes

      - name: Generate the branch and row parent
        env:
          DEGREE: ${{ matrix.degree }}
          COVER_LEFT: ${{ matrix.cover_left }}
          PARENT_INDEX: ${{ matrix.parent_index }}
          EXACT_SEQUENTIAL: ${{ matrix.exact_sequential || false }}
        run: |
          mkdir -p work certificate
          stem="n20_d${DEGREE}p${COVER_LEFT}"
          exact_args=()
          if [[ "$EXACT_SEQUENTIAL" == "true" ]]; then
            exact_args+=(--exact-sequential)
          fi
          python3 research/minimum_counterexample/generate_tournament_cnf.py \
            20 "$DEGREE" "work/${stem}.cnf" \
            --encoding conditional-cover \
            --root-cover-left "$COVER_LEFT" \
            --symmetry hierarchical-profile-ties \
            "${exact_args[@]}"
          python3 research/minimum_counterexample/make_branch_row_cubes.py \
            "work/${stem}.json" "work/${stem}.row.cubes"
          prefix="work/${stem}.cube_${PARENT_INDEX}"
          python3 research/minimum_counterexample/make_parent_refinement.py \
            "work/${stem}.cnf" "work/${stem}.json" \
            "work/${stem}.row.cubes" "$PARENT_INDEX" \
            "${prefix}.cnf" "${prefix}.unused.cubes" \
            "${prefix}.parent.json" --depth 1

      - name: Resolve the unique prior artifact
        if: ${{ matrix.resume_run_id }}
        id: resolve_resume
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ matrix.resume_run_id }}
          ARTIFACT_NAME: >-
            order20-adaptive-rup-d${{ matrix.degree }}-p${{ matrix.cover_left }}-c${{ matrix.parent_index }}
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}/artifacts?per_page=100" \
            > resume-artifacts.json
          jq --arg name "$ARTIFACT_NAME" \
            '[.artifacts[] | select(.name == $name and .expired == false)]' \
            resume-artifacts.json > matching-artifacts.json
          count="$(jq 'length' matching-artifacts.json)"
          if [[ "$count" != "1" ]]; then
            echo "expected one unexpired artifact named $ARTIFACT_NAME, found $count" >&2
            exit 1
          fi
          artifact_id="$(jq -r '.[0].id' matching-artifacts.json)"
          artifact_digest="$(jq -r '.[0].digest' matching-artifacts.json)"
          if [[ ! "$artifact_id" =~ ^[1-9][0-9]*$ ||
                ! "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "prior artifact has invalid id or digest" >&2
            exit 1
          fi
          jq '.[0]' matching-artifacts.json \
            > certificate/RESUME_ARTIFACT.json
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"

      - name: Download prior partial certificate
        if: ${{ matrix.resume_run_id }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve_resume.outputs.artifact_id }}
          path: resume-artifact
          merge-multiple: true
          run-id: ${{ matrix.resume_run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Audit and restore the prior partial certificate
        if: ${{ matrix.resume_run_id }}
        env:
          DEGREE: ${{ matrix.degree }}
          COVER_LEFT: ${{ matrix.cover_left }}
          PARENT_INDEX: ${{ matrix.parent_index }}
        run: |
          set -euo pipefail
          stem="n20_d${DEGREE}p${COVER_LEFT}"
          parent="work/${stem}.cube_${PARENT_INDEX}.cnf"
          python3 \
            research/minimum_counterexample/audit_adaptive_certificate.py \
            resume-artifact/certificate/adaptive "$parent" \
            --require-partial \
            --require-rup \
            --report certificate/RESUME_AUDIT.json
          test ! -e certificate/adaptive
          mv resume-artifact/certificate/adaptive certificate/adaptive

      - name: Produce and check the adaptive certificate tree
        id: produce
        env:
          DEGREE: ${{ matrix.degree }}
          COVER_LEFT: ${{ matrix.cover_left }}
          PARENT_INDEX: ${{ matrix.parent_index }}
          RESUME_RUN_ID: ${{ matrix.resume_run_id }}
          SOLVER_WALL_MINUTES: ${{ matrix.solver_wall_minutes || 300 }}
        run: |
          set -euo pipefail
          stem="n20_d${DEGREE}p${COVER_LEFT}"
          parent="work/${stem}.cube_${PARENT_INDEX}.cnf"
          solver="tools/gimsatul/gimsatul"
          solver_kind="gimsatul"
          proof_mode="rup"
          if [[ "${{ matrix.use_cadical || false }}" == "true" &&
                "${{ matrix.use_kissat || false }}" == "true" ]]; then
            echo "choose at most one alternate solver" >&2
            exit 2
          fi
          if [[ "${{ matrix.use_cadical || false }}" == "true" ]]; then
            solver="tools/cadical/build/cadical"
            solver_kind="cadical"
          fi
          if [[ "${{ matrix.use_kissat || false }}" == "true" ]]; then
            solver="tools/kissat/build/kissat"
            solver_kind="kissat"
          fi
          if [[ "${{ matrix.allow_drat || false }}" == "true" ]]; then
            proof_mode="drat"
          fi
          resume_args=()
          if [[ -n "$RESUME_RUN_ID" ]]; then
            resume_args+=(--resume)
          fi
          if [[ "${{ matrix.split_on_resume || false }}" == "true" ]]; then
            resume_args+=(--split-on-resume)
          fi
          if [[ "${{ matrix.additional_rounds || 0 }}" != "0" ]]; then
            resume_args+=(
              --additional-rounds
              "${{ matrix.additional_rounds }}"
            )
          fi
          if [[ ! "$SOLVER_WALL_MINUTES" =~ ^[1-9][0-9]*$ ||
                "$SOLVER_WALL_MINUTES" -gt 300 ]]; then
            echo "solver_wall_minutes must be an integer from 1 through 300" >&2
            exit 2
          fi
          set +e
          timeout --signal=TERM --kill-after=30s \
            "${SOLVER_WALL_MINUTES}m" \
            python3 research/minimum_counterexample/adaptive_certify_parent.py \
            "$parent" certificate/adaptive \
            tools/generate-cadical-cubes \
            "$solver" tools/drat-trim/drat-trim \
            --solver-kind "$solver_kind" \
            --proof-mode "$proof_mode" \
            --initial-depth "${{ matrix.initial_depth || 8 }}" \
            --additional-depth "${{ matrix.additional_depth || 6 }}" \
            --seconds "${{ matrix.seconds || 120 }}" \
            --maximum-seconds "${{ matrix.maximum_seconds || 600 }}" \
            --checker-seconds "${{ matrix.checker_seconds || 0 }}" \
            --constant-rounds "${{ matrix.constant_rounds || 1 }}" \
            --retries-before-split \
              "${{ matrix.retries_before_split || 0 }}" \
            --jobs "${{ matrix.jobs || 4 }}" \
            --rounds "${{ matrix.rounds || 8 }}" \
            --xz-level "${{ matrix.xz_level || 1 }}" \
            --fixed-variable-upper-bound \
              "${{ matrix.fixed_variable_upper_bound || 0 }}" \
            "${resume_args[@]}"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record provenance
        if: always()
        run: |
          git -C tools/gimsatul rev-parse HEAD \
            > certificate/GIMSATUL_COMMIT.txt
          git -C tools/drat-trim rev-parse HEAD \
            > certificate/DRAT_TRIM_COMMIT.txt
          git -C tools/cadical rev-parse HEAD \
            > certificate/CADICAL_COMMIT.txt
          git -C tools/kissat rev-parse HEAD \
            > certificate/KISSAT_COMMIT.txt
          gcc --version | head -n 1 > certificate/GCC_VERSION.txt

      - name: Audit the complete committed certificate tree
        if: always()
        id: adaptive_audit
        env:
          DEGREE: ${{ matrix.degree }}
          COVER_LEFT: ${{ matrix.cover_left }}
          PARENT_INDEX: ${{ matrix.parent_index }}
        run: |
          set -euo pipefail
          stem="n20_d${DEGREE}p${COVER_LEFT}"
          parent="work/${stem}.cube_${PARENT_INDEX}.cnf"
          python3 \
            research/minimum_counterexample/audit_adaptive_certificate.py \
            certificate/adaptive "$parent" \
            --require-rup \
            --prune-uncommitted \
            --report certificate/ADAPTIVE_AUDIT.json

      - name: Upload checked adaptive certificate
        if: ${{ always() && steps.adaptive_audit.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: order20-adaptive-rup-d${{ matrix.degree }}-p${{ matrix.cover_left }}-c${{ matrix.parent_index }}
          path: |
            work/*.cnf
            work/*.json
            work/*.cubes
            certificate/*.json
            certificate/*.txt
            certificate/**/*.json
            certificate/**/*.cubes
            certificate/**/*.log
            certificate/**/*.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
