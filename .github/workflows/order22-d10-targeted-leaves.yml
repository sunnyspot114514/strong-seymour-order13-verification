name: Order-22 d10 targeted leaves

on:
  workflow_dispatch:
    inputs:
      solver_seconds:
        description: Per-leaf Gimsatul time limit
        required: true
        type: number
        default: 3600

permissions:
  contents: read

jobs:
  solve-leaf:
    name: ${{ matrix.label }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: d10p5-tail7
            cover_left: 5
            literals: "116 117 118 119 -130 131 132 133"
          - label: d10p5-tail11
            cover_left: 5
            literals: "116 117 118 119 130 -131 132 133"
          - label: d10p5-tail15
            cover_left: 5
            literals: "116 117 118 119 130 131 132 133"
          - label: d10p6-tail7
            cover_left: 6
            literals: "130 131 132 143 144 145"
          - label: d10p7-tail3
            cover_left: 7
            literals: "143 144 155 156"

    steps:
      - uses: actions/checkout@v4

      - name: Build pinned Gimsatul
        run: |
          git clone --quiet https://github.com/arminbiere/gimsatul.git tools/gimsatul
          git -C tools/gimsatul checkout --quiet 4664fd74c97f87e30e7f907181707679b6fa49f2
          cd tools/gimsatul
          ./configure
          make -j4

      - name: Generate the branch and exact leaf
        env:
          COVER_LEFT: ${{ matrix.cover_left }}
          LEAF_LITERALS: ${{ matrix.literals }}
        run: |
          mkdir -p work
          python3 research/minimum_counterexample/generate_tournament_cnf.py \
            22 10 work/branch.cnf \
            --encoding conditional-cover \
            --root-cover-left "$COVER_LEFT" \
            --symmetry hierarchical-profile-ties
          printf 'a %s 0\n' "$LEAF_LITERALS" > work/leaf.cubes

      - name: Solve the selected leaf
        env:
          SOLVER_LIMIT: ${{ inputs.solver_seconds }}
        run: |
          python3 research/minimum_counterexample/solve_cubes.py \
            work/branch.cnf work/leaf.cubes \
            work/solve tools/gimsatul/gimsatul \
            --seconds "$SOLVER_LIMIT" --jobs 1 \
            --solver-kind gimsatul --solver-threads 4 --allow-partial

      - name: Record source and tool hashes
        run: |
          sha256sum \
            work/branch.cnf \
            work/branch.json \
            work/leaf.cubes \
            tools/gimsatul/gimsatul \
            > work/SHA256SUMS.txt
          git -C tools/gimsatul rev-parse HEAD > work/GIMSATUL_COMMIT.txt

      - name: Upload deterministic search summary
        uses: actions/upload-artifact@v4
        with:
          name: order22-${{ matrix.label }}
          path: |
            work/*.json
            work/*.cubes
            work/*.txt
            work/solve/cube_sweep.json
          retention-days: 14
