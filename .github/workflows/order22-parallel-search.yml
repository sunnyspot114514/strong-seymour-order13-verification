name: Order-22 parallel search

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    name: d${{ matrix.degree }} p${{ matrix.cover_left }}
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {degree: 8, cover_left: 0}
          - {degree: 8, cover_left: 1}
          - {degree: 9, cover_left: 0}
          - {degree: 9, cover_left: 1}
          - {degree: 9, cover_left: 2}
          - {degree: 9, cover_left: 3}
          - {degree: 9, cover_left: 5}
          - {degree: 9, cover_left: 6}
          - {degree: 10, cover_left: 0}
          - {degree: 10, cover_left: 1}
          - {degree: 10, cover_left: 2}
          - {degree: 10, cover_left: 3}
          - {degree: 10, cover_left: 4}
          - {degree: 10, cover_left: 5}
          - {degree: 10, cover_left: 6}
          - {degree: 10, cover_left: 7}

    steps:
      - uses: actions/checkout@v4

      - name: Build pinned Kissat
        run: |
          git clone --quiet https://github.com/arminbiere/kissat.git tools/kissat
          git -C tools/kissat checkout --quiet 8af8e56f174b778aef3aa45af9f739b2a5f492c2
          cd tools/kissat
          ./configure --quiet
          make -C build -j4

      - name: Build pinned Gimsatul
        run: |
          git clone --quiet https://github.com/arminbiere/gimsatul.git tools/gimsatul
          git -C tools/gimsatul checkout --quiet 4664fd74c97f87e30e7f907181707679b6fa49f2
          cd tools/gimsatul
          ./configure
          make -j4

      - name: Generate the branch and its exhaustive row partition
        env:
          DEGREE: ${{ matrix.degree }}
          COVER_LEFT: ${{ matrix.cover_left }}
        run: |
          mkdir -p work
          stem="n22_d${DEGREE}p${COVER_LEFT}"
          python3 research/minimum_counterexample/generate_tournament_cnf.py \
            22 "$DEGREE" "work/${stem}.cnf" \
            --encoding conditional-cover \
            --root-cover-left "$COVER_LEFT" \
            --symmetry hierarchical-profile-ties
          python3 research/minimum_counterexample/make_branch_row_cubes.py \
            "work/${stem}.json" "work/${stem}.row.cubes"

      - name: Solve all row cases with Kissat
        env:
          DEGREE: ${{ matrix.degree }}
          COVER_LEFT: ${{ matrix.cover_left }}
        run: |
          stem="n22_d${DEGREE}p${COVER_LEFT}"
          python3 research/minimum_counterexample/solve_cubes.py \
            "work/${stem}.cnf" "work/${stem}.row.cubes" \
            "work/${stem}.kissat5" tools/kissat/build/kissat \
            --seconds 5 --jobs 4
          python3 research/minimum_counterexample/extract_unknown_cubes.py \
            "work/${stem}.kissat5/cube_sweep.json" \
            "work/${stem}.unknown.cubes"

      - name: Run a four-worker Gimsatul portfolio on the hard cases
        env:
          DEGREE: ${{ matrix.degree }}
          COVER_LEFT: ${{ matrix.cover_left }}
        run: |
          stem="n22_d${DEGREE}p${COVER_LEFT}"
          if grep -q '^a ' "work/${stem}.unknown.cubes"; then
            python3 research/minimum_counterexample/solve_cubes.py \
              "work/${stem}.cnf" "work/${stem}.unknown.cubes" \
              "work/${stem}.gimsatul60" tools/gimsatul/gimsatul \
              --seconds 60 --jobs 4 --solver-kind gimsatul \
              --solver-threads 1 --allow-partial
          else
            printf '%s\n' '{"counts":{"SAT":0,"UNSAT":0,"UNKNOWN":0,"ERROR":0}}' \
              > "work/${stem}.gimsatul60.json"
          fi

      - name: Record source and tool hashes
        env:
          DEGREE: ${{ matrix.degree }}
          COVER_LEFT: ${{ matrix.cover_left }}
        run: |
          stem="n22_d${DEGREE}p${COVER_LEFT}"
          sha256sum \
            "work/${stem}.cnf" \
            "work/${stem}.json" \
            "work/${stem}.row.cubes" \
            tools/kissat/build/kissat \
            tools/gimsatul/gimsatul \
            > "work/${stem}.SHA256SUMS.txt"
          git -C tools/kissat rev-parse HEAD > work/KISSAT_COMMIT.txt
          git -C tools/gimsatul rev-parse HEAD > work/GIMSATUL_COMMIT.txt

      - name: Upload deterministic search summaries
        uses: actions/upload-artifact@v4
        with:
          name: order22-d${{ matrix.degree }}-p${{ matrix.cover_left }}
          path: |
            work/*.json
            work/*.cubes
            work/*.txt
            work/*/cube_sweep.json
          retention-days: 14
